aid: roofstock
name: Roofstock
description: >-
  Roofstock is a residential real estate investment platform and online marketplace for buying,
  selling, and managing single-family rental (SFR) homes. It gives individual and institutional
  investors research, analytics, certified property listings, and end-to-end services spanning
  acquisitions, property management (Mynd), portfolio accounting software (Stessa), tenant
  screening (RentPrep), asset management, and dispositions across dozens of U.S. markets. The
  company reports hundreds of thousands of users and over $10B in transacted volume. Roofstock
  operates a private web API (api.roofstock.com) and a GraphQL endpoint powering its marketplace
  applications; it does not currently publish a public developer portal, OpenAPI specification,
  first-party SDKs, or documented API access. This profile was surfaced as a portfolio company of
  Lightspeed Venture Partners and SoftBank Vision Fund and enriched from Roofstock's public web
  surface.
